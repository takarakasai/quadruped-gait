# Virtual workspace for the quadruped locomotion stack, split out of the
# articara repo (2026-07): `quadruped-gait` (gait generation + MPC) and
# `legged-estimation` (state estimation). Both consume `misarta` as a
# git dependency; the behavioural walk-regression suite (MuJoCo) stays
# in the articara repo, which consumes these crates via git.
[workspace]
members = ["quadruped-gait", "legged-estimation", "policy-runtime"]
resolver = "3"

# TEMPORARY (dev-only, not pushed): pin misa-wbc to the local sibling
# checkout so the srbd_mpc::tests::mpc_backend_bench comparison can
# use Ipm/Admm/Clarabel, which postdate the git rev this workspace is
# currently pinned to. Revert (or push misa-wbc + bump the git rev)
# once that comparison no longer needs to track local-only commits.
[patch."https://github.com/takarakasai/misa-wbc.git"]
misa-wbc = { path = "../misa-wbc" }
